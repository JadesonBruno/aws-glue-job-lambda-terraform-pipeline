name: Main Deployment

on:
    push:
        branches:
            - main

permissions:
    id-token: write
    contents: read

jobs:
    terraform-main:
        uses: ./.github/workflows/terraform.yml
        with:
            environment: main
            aws-region: us-east-1
        secrets:
            aws-assume-role-arn: ${{ secrets.AWS_ASSUME_ROLE_ARN }}
            aws-s3-bucket-backend-statefile: ${{ secrets.AWS_S3_BUCKET_BACKEND_STATEFILE }}
            aws-dynamodb-table-backend-lock: ${{ secrets.AWS_DYNAMODB_TABLE_BACKEND_LOCK }}
